name: Oracle Stage 2.3 Shadow Formatter

on:
  push:
    branches:
      - "agent/oracle-stage-2-3-shadow-runtime"

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'mytwc2024-sudo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format shadow files
        run: |
          deno fmt supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow.ts supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow.test.ts
      - name: Commit formatting if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow.ts supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow.test.ts
          git commit -m "Format hybrid ranking plan shadow"
          git push
