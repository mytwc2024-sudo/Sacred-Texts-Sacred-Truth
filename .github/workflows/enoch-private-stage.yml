name: AKST Private Enoch Witness Stage
on:
  pull_request:
    paths:
      - "src/ingest/enoch-witness.ts"
      - "supabase/functions/akst-stage-enoch-1917/**"
      - "supabase/migrations/20261009_enoch_*"
      - "scripts/*enoch*"
      - "package.json"
      - ".github/workflows/enoch-private-stage.yml"
  push:
    branches: [main]
    paths:
      - "src/ingest/enoch-witness.ts"
      - "supabase/functions/akst-stage-enoch-1917/**"
      - "supabase/migrations/20261009_enoch_*"
      - "scripts/*enoch*"
      - ".github/workflows/enoch-private-stage.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:enoch
      - run: node scripts/test-enoch-stage-boundary.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - run: deno check --node-modules-dir=auto supabase/functions/akst-stage-enoch-1917/index.ts
