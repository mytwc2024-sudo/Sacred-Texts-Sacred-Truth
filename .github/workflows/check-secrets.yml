name: Check Secrets (debug)

# Temporary diagnostic. Reports only whether each secret is visible to the job
# and its length — never the value. Delete after use.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence (values are never printed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          report() {
            name="$1"; val="$2"
            if [ -n "$val" ]; then
              echo "$name: SET (length=${#val})"
            else
              echo "$name: EMPTY or MISSING"
            fi
          }
          report SUPABASE_URL "$SUPABASE_URL"
          report SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          report OPENAI_API_KEY "$OPENAI_API_KEY"
