name: Oracle Contract CI

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/oracle-contract-ci.yml"
  push:
    branches:
      - "main"
      - "agent/oracle-stage-2-2-retrieval-intelligence"
      - "agent/oracle-stage-2-2-evidence-relationship"
      - "agent/oracle-stage-2-2-query-decomposition"
      - "agent/oracle-stage-2-2-query-plan-metadata"
      - "agent/oracle-stage-2-2-shadow-evaluation"
      - "agent/oracle-stage-2-2-shadow-runtime"
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/oracle-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Oracle contract formatting
        run: deno fmt --check supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/_shared/oracle-evidence-relationship.test.ts supabase/functions/_shared/oracle-query-plan.ts supabase/functions/_shared/oracle-query-plan.test.ts supabase/functions/_shared/oracle-query-plan-integration.test.ts supabase/functions/_shared/oracle-query-plan-shadow.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts supabase/functions/_shared/oracle-query-plan-shadow-runtime.ts supabase/functions/_shared/oracle-query-plan-shadow-runtime.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts

      - name: Run Oracle contract tests
        run: deno test supabase/functions/_shared/oracle-contract.test.ts supabase/functions/_shared/oracle-evidence-relationship.test.ts supabase/functions/_shared/oracle-query-plan.test.ts supabase/functions/_shared/oracle-query-plan-integration.test.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts supabase/functions/_shared/oracle-query-plan-shadow-runtime.test.ts
