name: Oracle Contract CI

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/oracle-contract-ci.yml"
  push:
    branches:
      - "agent/oracle-evolution-map"
    paths:
      - "supabase/functions/**"
      - ".github/workflows/oracle-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format Oracle contract sources in runner
        run: deno fmt supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts

      - name: Run Oracle contract tests
        run: deno test supabase/functions/_shared/oracle-contract.test.ts

      - name: Show formatter patch
        if: always()
        run: git diff -- supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts

      - name: Require committed formatting
        if: always()
        run: git diff --exit-code -- supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts
