name: Oracle Contract CI

on:
  push:
    branches:
      - "agent/oracle-stage-2-2-shadow-evaluation"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format Oracle shadow evaluator sources
        run: deno fmt supabase/functions/_shared/oracle-query-plan-shadow.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts

      - name: Run full Oracle contract tests
        run: deno test supabase/functions/_shared/oracle-contract.test.ts supabase/functions/_shared/oracle-evidence-relationship.test.ts supabase/functions/_shared/oracle-query-plan.test.ts supabase/functions/_shared/oracle-query-plan-integration.test.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts

      - name: Commit exact Deno formatting
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/_shared/oracle-query-plan-shadow.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts; then
            echo "Formatting already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/oracle-query-plan-shadow.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts
          git commit -m "Format Stage 2.2 Oracle shadow evaluator sources"
          git push origin HEAD:agent/oracle-stage-2-2-shadow-evaluation
