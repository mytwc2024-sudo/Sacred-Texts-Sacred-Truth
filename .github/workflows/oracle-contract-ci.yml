name: Oracle Contract CI

on:
  push:
    branches:
      - "agent/oracle-evolution-map"
    paths:
      - "supabase/functions/**"
      - ".github/workflows/oracle-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format Oracle contract sources
        run: deno fmt supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts

      - name: Run Oracle contract tests
        run: deno test supabase/functions/_shared/oracle-contract.test.ts

      - name: Commit exact Deno formatting
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts; then
            echo "Formatting already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/oracle-contract.ts supabase/functions/_shared/oracle-contract.test.ts supabase/functions/oracle-query/index.ts supabase/functions/ask-akst/index.ts
          git commit -m "Format Oracle contract sources"
          git push origin HEAD:agent/oracle-evolution-map
