name: Oracle Recombination Runtime Patch

on:
  push:
    branches:
      - "agent/oracle-stage-2-2-recombination-runtime"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded recombination runtime patch
        run: python .github/scripts/apply-oracle-recombination-runtime-patch.py

      - name: Format changed Oracle sources
        run: deno fmt supabase/functions/oracle-query/index.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.test.ts

      - name: Run full Oracle contract tests
        run: deno test supabase/functions/_shared/oracle-contract.test.ts supabase/functions/_shared/oracle-evidence-relationship.test.ts supabase/functions/_shared/oracle-query-plan.test.ts supabase/functions/_shared/oracle-query-plan-integration.test.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts supabase/functions/_shared/oracle-query-plan-shadow-runtime.test.ts supabase/functions/_shared/oracle-query-plan-recombination.test.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.test.ts

      - name: Commit guarded runtime patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/oracle-query/index.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.test.ts
          git commit -m "Wire shadow recombination diagnostics into Oracle runtime"
          git push origin HEAD:agent/oracle-stage-2-2-recombination-runtime
