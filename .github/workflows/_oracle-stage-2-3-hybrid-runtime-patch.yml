name: Oracle Stage 2.3 Hybrid Runtime Patch

on:
  push:
    branches:
      - "agent/oracle-stage-2-3-hybrid-runtime"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'mytwc2024-sudo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded Oracle hybrid shadow wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/oracle-query/index.ts")
          s = p.read_text()
          old = 'import { buildOracleQueryPlanShadowDiagnostics } from "../_shared/oracle-query-plan-shadow-diagnostics.ts";\n'
          new = old + 'import { executeOracleHybridRankingPlanShadowAgainstDb } from "../_shared/oracle-hybrid-ranking-plan-shadow-runtime.ts";\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '    const runShadowQueryPlan = body?.shadow_query_plan === true;\n'
          new = old + '    const runShadowHybridRanking = body?.shadow_hybrid_ranking === true;\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''      const queryPlanShadow = runShadowQueryPlan\n        ? await executeQueryPlanShadow(db, oracleV1.query_plan)\n        : undefined;\n'''
          new = old + '''      const hybridRankingPlanShadow = runShadowHybridRanking\n        ? await executeOracleHybridRankingPlanShadowAgainstDb(db, oracleV1.query_plan, nativeEmbed)\n        : undefined;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''    const queryPlanShadow = runShadowQueryPlan\n      ? await executeQueryPlanShadow(db, oracleV1.query_plan)\n      : undefined;\n'''
          new = old + '''    const hybridRankingPlanShadow = runShadowHybridRanking\n      ? await executeOracleHybridRankingPlanShadowAgainstDb(db, oracleV1.query_plan, nativeEmbed)\n      : undefined;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''              ...buildOracleQueryPlanShadowDiagnostics(queryPlanShadow),\n'''
          new = old + '''              ...(hybridRankingPlanShadow\n                ? { hybrid_ranking_plan_shadow: hybridRankingPlanShadow }\n                : {}),\n'''
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format and test
        run: |
          deno fmt supabase/functions/oracle-query/index.ts supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow-runtime.ts
          deno test supabase/functions/_shared/oracle-contract.test.ts supabase/functions/_shared/oracle-evidence-relationship.test.ts supabase/functions/_shared/oracle-query-plan.test.ts supabase/functions/_shared/oracle-query-plan-integration.test.ts supabase/functions/_shared/oracle-query-plan-shadow.test.ts supabase/functions/_shared/oracle-query-plan-shadow-runtime.test.ts supabase/functions/_shared/oracle-query-plan-recombination.test.ts supabase/functions/_shared/oracle-query-plan-shadow-diagnostics.test.ts supabase/functions/_shared/oracle-hybrid-ranking.test.ts supabase/functions/_shared/oracle-hybrid-ranking-shadow.test.ts supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/oracle-query/index.ts supabase/functions/_shared/oracle-hybrid-ranking-plan-shadow-runtime.ts
          git commit -m "Wire hybrid ranking plan shadow into Oracle" || exit 0
          git push
