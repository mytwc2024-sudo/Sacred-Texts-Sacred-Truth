name: AKST Embedding Backfill

# Embeds chunks that are already stored in Supabase but have no vector yet.
# Decoupled from scraping, so it works even when the source site is unreachable.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Backfill a single title (exact match). Leave blank for all.'
        required: false
        type: string
      dry_run:
        description: 'Only count chunks needing embeddings (no OpenAI, no writes).'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Cap the number of chunks embedded this run (blank = no cap).'
        required: false
        type: string

concurrency:
  group: akst-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backfill embeddings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          FLAGS=()
          if [ "$DRY_RUN" = "true" ]; then FLAGS+=("--dry-run"); fi
          if [ -n "$ONLY" ]; then FLAGS+=("--only" "$ONLY"); fi
          if [ -n "$LIMIT" ]; then FLAGS+=("--limit" "$LIMIT"); fi
          npx tsx src/embed/backfill.ts "${FLAGS[@]}"
